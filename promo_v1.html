<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<audio id="au" preload="auto"></audio>
<script>
'use strict';
const W = 1920, H = 1080, BPM = 90, BEAT = 60 / BPM, BAR = BEAT * 4, TOTAL = 87 * BAR + 4;
const EXPORT = /[?&]export=1/.test(location.search);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const PI = Math.PI, TAU = PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const eexpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const win = (t, a, b, fi = .5, fo = .5) => sstep(a, a + fi, t) * (1 - sstep(b - fo, b, t));
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash1 = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const F_ZH = '"Noto Serif SC", "Source Han Serif SC", "SimSun", serif';
const F_EN = '"Cinzel", "Times New Roman", serif';
const F_IT = '"Cormorant Garamond", "Times New Roman", serif';
const F_MATH = '"STIX Two Text", "Cambria Math", "Times New Roman", serif';
const F_SCRIPT = '"Great Vibes", cursive';

function text(s, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.style || ''} ${o.weight || 400} ${o.size || 40}px ${o.font || F_ZH}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.ls) { ctx.letterSpacing = o.ls + 'px'; if ((o.align || 'center') === 'center') x += o.ls / 2; }
  ctx.globalAlpha = o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 24; }
  ctx.fillStyle = o.color || '#fff';
  ctx.fillText(s, x, y);
  ctx.restore();
}
function goldGrad(x0, y0, x1, y1, s) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, '#6e4b1b'); g.addColorStop(.35, '#d9b25c');
  if (s > .05 && s < .95) { g.addColorStop(s - .05, '#e7c574'); g.addColorStop(s, '#fff6dc'); g.addColorStop(s + .05, '#e7c574'); }
  g.addColorStop(.7, '#c99a45'); g.addColorStop(1, '#7a5520');
  return g;
}
function glowDot(x, y, r, col, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(.18, col.replace('A', a * .9)); g.addColorStop(1, col.replace('A', 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}

// ======================================================================== WebGL backdrop shaders
const glc = document.createElement('canvas'); glc.width = W; glc.height = H;
const gl = glc.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false });
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform int uMode; uniform vec3 uTint; uniform float uAmp;
uniform int uKA; uniform int uKB; uniform float uKMix; uniform float uKZoom; uniform float uKRot;
uniform float uP; uniform float uQ; uniform vec2 uA; uniform float uHRot; uniform float uHRad; uniform float uHue;
out vec4 o;
#define PI 3.14159265359
float hash(vec2 p){ uvec2 q=uvec2(ivec2(p)+ivec2(4096))*uvec2(1597334673u,3812015801u); uint n=(q.x^q.y)*1597334673u; n^=n>>16; n*=2246822519u; n^=n>>13; return float(n)*(1./4294967295.); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<6;i++){ s+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
vec3 hsv(float h,float s,float v){ vec3 k=clamp(abs(mod(h*6.+vec3(0,4,2),6.)-3.)-1.,0.,1.); return v*mix(vec3(1),k,s); }
vec3 nebula(vec2 uv){
  float t=uTime*.02; vec2 p=uv*1.25;
  vec2 q=vec2(fbm(p+t), fbm(p+vec2(5.2,1.3)-t));
  float n=fbm(p+2.2*q+vec2(t*2.,0.));
  vec3 c=vec3(.008,.01,.025);
  c+=uTint*smoothstep(.35,1.05,n)*1.3;
  c+=uTint.zxy*.45*pow(clamp(q.y-.2,0.,1.),3.);
  vec2 g=floor(gl_FragCoord.xy/2.); float h=hash(g);
  c+=vec3(.9,.95,1.)*step(.9975,h)*(.55+.45*sin(uTime*2.+h*500.));
  return c;
}
vec2 kfold(vec2 p, int m){
  vec2 g; float n;
  if(m==0||m==2){ g=fract(p)-.5; n=4.; }
  else { vec2 s=vec2(1.,1.7320508); vec2 a=mod(p,s)-s*.5; vec2 b=mod(p-s*.5,s)-s*.5; g=dot(a,a)<dot(b,b)?a:b; n=(m==4)?3.:6.; }
  bool mir=(m==0||m==1);
  float ang=atan(g.y,g.x), r=length(g), sec=2.*PI/n;
  ang=mod(ang,sec); if(mir) ang=abs(ang-sec*.5);
  return r*vec2(cos(ang),sin(ang));
}
vec3 kpat(vec2 q, float t){
  float d1=abs(length(q-vec2(.29,.0))-.17-.03*sin(t*.7));
  float d2=abs(length(q-vec2(.12,.1))-.07-.025*sin(t*1.1+1.));
  float a=.6+.35*sin(t*.3);
  float d3=abs(dot(q,vec2(cos(a),sin(a)))-.13-.03*sin(t*.4));
  float d4=abs(length(q)-.36-.03*sin(t*.5));
  float d5=abs(max(abs(q.x-.25),abs(q.y-.02))-.06-.02*sin(t*.9));
  vec3 gold=vec3(1.,.72,.3), teal=vec3(.15,.85,.9), rose=vec3(1.,.3,.55);
  vec3 c=gold*.0045/(d1+.0025)+teal*.003/(d2+.0025)+rose*.0025/(d3+.003)+gold*.002/(d4+.002)+teal*.002/(d5+.003);
  float f1=smoothstep(.012,-.012,length(q-vec2(.29,0.))-.17-.03*sin(t*.7));
  float f2=smoothstep(.012,-.012,length(q)-.36-.03*sin(t*.5));
  c+=mix(vec3(.015,.03,.08),vec3(.03,.14,.2),f2)+vec3(.28,.07,.22)*f1*(.55+.45*sin(t*1.3+length(q)*14.));
  c+=vec3(.03,.07,.1)*smoothstep(.5,.0,length(q));
  return c;
}
vec3 kaleido(vec2 uv){
  vec2 p=uv*uKZoom; float c=cos(uKRot), s=sin(uKRot); p=mat2(c,-s,s,c)*p;
  vec3 col=mix(kpat(kfold(p,uKA),uTime), kpat(kfold(p,uKB),uTime), uKMix);
  col*=.9+.2*sin(length(uv)*3.-uTime);
  return 1.-exp(-col*1.35);
}
vec2 cmul(vec2 a, vec2 b){ return vec2(a.x*b.x-a.y*b.y, a.x*b.y+a.y*b.x); }
vec2 cdiv(vec2 a, vec2 b){ return vec2(a.x*b.x+a.y*b.y, a.y*b.x-a.x*b.y)/dot(b,b); }
vec3 hyper(vec2 uv){
  vec2 z=uv/uHRad; float r2=dot(z,z);
  if(r2>=1.){ float rim=exp(-(sqrt(r2)-1.)*30.); return vec3(.45,.6,1.)*rim*.7+nebula(uv)*.5; }
  vec2 z0=z;
  z=cdiv(z+uA, vec2(1.,0.)+cmul(vec2(uA.x,-uA.y),z));
  float c0=cos(uHRot), s0=sin(uHRot); z=mat2(c0,-s0,s0,c0)*z;
  float sp=sin(PI/uP), cp=cos(PI/uP), cq=cos(PI/uQ);
  float rr=sp/sqrt(cq*cq-sp*sp), cc=sqrt(1.+rr*rr);
  vec2 n=vec2(-sp,cp);
  float flips=0., inv=0.;
  for(int i=0;i<90;i++){
    bool ch=false;
    if(z.y<0.){ z.y=-z.y; flips+=1.; ch=true; }
    float d=dot(z,n); if(d>0.){ z-=2.*d*n; flips+=1.; ch=true; }
    vec2 w=z-vec2(cc,0.); float l2=dot(w,w);
    if(l2<rr*rr){ z=vec2(cc,0.)+w*(rr*rr/l2); flips+=1.; inv+=1.; ch=true; }
    if(!ch) break;
  }
  float px=(2./uRes.y/uHRad)*(1.-dot(z,z))/max(1.-r2,1e-5);
  float dE=abs(length(z-vec2(cc,0.))-rr);
  float dM=min(z.y, abs(dot(z,n)));
  float lineE=1.-smoothstep(.006, .006+px*1.5, dE);
  float lineM=1.-smoothstep(.0015, .0015+px*1.5, dM);
  float par=mod(flips,2.);
  vec3 base=hsv(uHue+inv*.045, .7, .42+.22*par);
  float shade=1.-.65*smoothstep(0.,1.,length(z)/(cc-rr));
  vec3 col=base*(.35+.65*shade);
  col=mix(col, vec3(1.,.9,.65), lineE*.95);
  col+=vec3(.55,.75,1.)*lineM*.22;
  float edgeFade=smoothstep(.93,1.,sqrt(r2));
  col=mix(col, vec3(.35,.45,.8), edgeFade*.7);
  return col;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/(.5*uRes.y);
  vec3 c = uMode==0 ? nebula(uv) : uMode==1 ? kaleido(uv) : hyper(uv);
  o=vec4(c*uAmp,1.);
}`;
const GLU = {};
(function initGL() {
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, '#version 300 es\nin vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }'); gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs, FS); gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(fs));
  const pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr); gl.useProgram(pr);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uRes', 'uTime', 'uMode', 'uTint', 'uAmp', 'uKA', 'uKB', 'uKMix', 'uKZoom', 'uKRot', 'uP', 'uQ', 'uA', 'uHRot', 'uHRad', 'uHue'])
    GLU[n] = gl.getUniformLocation(pr, n);
  gl.viewport(0, 0, W, H);
})();
function glDraw(mode, u = {}, alpha = 1) {
  gl.uniform2f(GLU.uRes, W, H); gl.uniform1f(GLU.uTime, u.time ?? 0); gl.uniform1i(GLU.uMode, mode);
  const t = u.tint || [.2, .3, .7]; gl.uniform3f(GLU.uTint, t[0], t[1], t[2]); gl.uniform1f(GLU.uAmp, u.amp ?? 1);
  gl.uniform1i(GLU.uKA, u.ka ?? 0); gl.uniform1i(GLU.uKB, u.kb ?? 0); gl.uniform1f(GLU.uKMix, u.kmix ?? 0);
  gl.uniform1f(GLU.uKZoom, u.kzoom ?? 2); gl.uniform1f(GLU.uKRot, u.krot ?? 0);
  gl.uniform1f(GLU.uP, u.p ?? 7); gl.uniform1f(GLU.uQ, u.q ?? 3); const a = u.a || [0, 0]; gl.uniform2f(GLU.uA, a[0], a[1]);
  gl.uniform1f(GLU.uHRot, u.hrot ?? 0); gl.uniform1f(GLU.uHRad, u.hrad ?? .92); gl.uniform1f(GLU.uHue, u.hue ?? .55);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(glc, 0, 0); ctx.restore();
}

// ======================================================================== shared assets
const rnd = mulberry(20260925);
const STARS = Array.from({ length: 500 }, () => ({ x: rnd() * W, y: rnd() * H, z: .2 + rnd() * .8, p: rnd() * TAU }));
function starfield(t, a = 1, vx = 8, vy = 0) {
  ctx.save(); ctx.fillStyle = '#fff';
  for (const s of STARS) {
    const x = ((s.x + t * vx * s.z) % W + W) % W, y = ((s.y + t * vy * s.z) % H + H) % H;
    ctx.globalAlpha = a * s.z * (.55 + .45 * Math.sin(t * 2 + s.p));
    const r = s.z * 2.2; ctx.fillRect(x, y, r, r);
  }
  ctx.restore();
}
function bgGrad(c0, c1, cx = W / 2, cy = H / 2) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 1200);
  g.addColorStop(0, c0); g.addColorStop(1, c1); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
// snowflake: a recursive D6-symmetric branch set, in unit coordinates
const SNOW = (() => {
  const segs = [];
  function branch(x, y, ang, len, depth) {
    const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len; segs.push([x, y, x2, y2]);
    if (!depth) return;
    for (const f of [.3, .5, .68, .84]) {
      const bx = x + Math.cos(ang) * len * f, by = y + Math.sin(ang) * len * f, bl = len * (depth === 2 ? .36 * (1.12 - f) : .45 * (1.1 - f));
      for (const s of [1, -1]) branch(bx, by, ang + s * PI / 3, bl, depth - 1);
    }
  }
  for (let k = 0; k < 6; k++) branch(0, 0, k * PI / 3 - PI / 2, 1, 2);
  for (let k = 0; k < 6; k++) { const a1 = k * PI / 3 - PI / 2, a2 = a1 + PI / 3; segs.push([.2 * Math.cos(a1), .2 * Math.sin(a1), .2 * Math.cos(a2), .2 * Math.sin(a2)]); }
  for (let k = 0; k < 6; k++) { const a1 = k * PI / 3 - PI / 3, a2 = a1 + PI / 3; segs.push([.34 * Math.cos(a1), .34 * Math.sin(a1), .34 * Math.cos(a2), .34 * Math.sin(a2)]); }
  return segs;
})();
const SNOWPTS = (() => {
  const lens = SNOW.map(s => Math.hypot(s[2] - s[0], s[3] - s[1])); const L = lens.reduce((a, b) => a + b, 0);
  const pts = []; const n = 2600; let acc = 0, si = 0;
  for (let i = 0; i < n; i++) {
    const d = (i + .5) / n * L; while (acc + lens[si] < d) { acc += lens[si]; si++; }
    const f = (d - acc) / lens[si], s = SNOW[si]; pts.push([lerp(s[0], s[2], f), lerp(s[1], s[3], f)]);
  }
  return pts.map(p => { const a = rnd() * TAU, d = 1.6 + rnd() * 2.2; return { tx: p[0], ty: p[1], sx: Math.cos(a) * d, sy: Math.sin(a) * d * .7,
    delay: .8 + rnd() * 3.2 + Math.hypot(p[0], p[1]) * 1.4, ea: rnd() * TAU, ed: .4 + rnd() * 2.4, sz: .8 + rnd() * 1.8 }; });
})();
function drawSnow(cx, cy, R, rot, a = 1, sx = 1, col = '170,220,255') {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(sx, 1); ctx.rotate(rot); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const [w, al] of [[10, .08], [5, .18], [2.2, .9]]) {
    ctx.beginPath(); for (const s of SNOW) { ctx.moveTo(s[0] * R, s[1] * R); ctx.lineTo(s[2] * R, s[3] * R); }
    ctx.strokeStyle = `rgba(${col},${al * a})`; ctx.lineWidth = w; ctx.stroke();
  }
  ctx.restore();
}

// ======================================================================== scene library
const SC = [];
function scene(o) { SC.push(o); return o; }

// ---------------------------------------------------------------- 0. cold open
scene({ start: 0, len: 4, fi: .01, subs: [[1.6, 4.9, '有些美，不在形状里，', 'Some beauty is not in the shape,'], [5.1, 10.3, '而在结构里。', 'but in the structure.']],
  draw(lt) {
    glDraw(0, { time: lt + 30, tint: [.12, .2, .55], amp: sstep(0, 4, lt) * .85 });
    const cx = W / 2, cy = H / 2 - 30, R = 360, rot = lt * .04;
    const c = Math.cos(rot), s = Math.sin(rot);
    // the seed of light
    const seed = sstep(0, 1.5, lt) * (1 - sstep(4, 7, lt)) * (1 + .3 * Math.sin(lt * 5));
    if (seed > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; glowDot(cx, cy, 140 * seed + 30, 'rgba(160,210,255,A)', seed); ctx.restore(); }
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#bfe3ff';
    for (const p of SNOWPTS) {
      const k = clamp((lt - p.delay) / 2.4); if (k <= 0) continue;
      const e = eio(k), sw = Math.sin(k * PI) * .5;
      let x = lerp(p.sx, p.tx, e) + Math.cos(p.ea) * sw * .3, y = lerp(p.sy, p.ty, e) + Math.sin(p.ea) * sw * .3;
      const X = cx + (x * c - y * s) * R, Y = cy + (x * s + y * c) * R;
      ctx.globalAlpha = clamp(k * 3) * (.5 + .5 * e); ctx.fillRect(X, Y, p.sz * (2 - e), p.sz * (2 - e));
    }
    ctx.restore();
    drawSnow(cx, cy, R, rot, sstep(6.5, 9.5, lt) * .9);
    if (lt > 9.4) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; glowDot(cx, cy, 900 * sstep(9.4, 10.67, lt), 'rgba(255,230,190,A)', sstep(9.4, 10.67, lt) * .8); ctx.restore(); }
  } });

// ---------------------------------------------------------------- 1. title
const RING_SYM = ['ℤ', 'ℚ', 'ℝ', 'ℂ', 'ℍ', '𝔽ₚ', 'S₅', 'A₅', 'D₆', 'GL(n)', 'SU(3)', 'E₈', 'ℤ/nℤ', 'Aut(G)', 'Gal(K/ℚ)', 'SO(3)', 'Sp(4)', '𝕄'];
function titleWord(str, cx, cy, size, lt, t0, stagger, ls, a = 1) {
  ctx.save(); ctx.font = `900 ${size}px ${F_ZH}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const ws = [...str].map(ch => ctx.measureText(ch).width); const total = ws.reduce((x, y) => x + y, 0) + ls * (ws.length - 1);
  let x = cx - total / 2; const sheenX = cx - total / 2 + (((lt * .32) % 1.8) - .3) * total;

]).catch(() => {}).then(() => document.fonts.ready).then(() => { fontsReady = true; const l = document.getElementById('load'); if (l) l.textContent = '字体已就绪 · 建议全屏观看（F）'; render(0); });
setTimeout(() => { fontsReady = true; }, 15000);

window.__ready = () => fontsReady;
window.__frame = t => { render(t); return cv.toDataURL('image/jpeg', .93); };
window.__duration = TOTAL;

const au = document.getElementById('au');
au.src = (window.EMBED && window.EMBED.audio) ? 'data:audio/mpeg;base64,' + window.EMBED.audio : 'music.mp3';
if (EXPORT) { document.getElementById('start').remove(); document.getElementById('ui').remove(); }
else {
  let playing = false, clock0 = 0, useAudio = true, hideT = 0;
  const ui = document.getElementById('ui'), pp = document.getElementById('pp'), fill = document.getElementById('fill'), tm = document.getElementById('tm');
  const now = () => useAudio ? au.currentTime : (performance.now() - clock0) / 1000;
  function loop() {
    const T = now(); render(T);
    fill.style.width = (T / TOTAL * 100) + '%'; tm.textContent = `${Math.floor(T / 60)}:${String(Math.floor(T % 60)).padStart(2, '0')}`;
    if (T >= TOTAL - .05) { playing = false; pp.textContent = '▶'; }
    if (playing) requestAnimationFrame(loop);
  }
  function play() { playing = true; pp.textContent = '❚❚'; au.play().catch(() => { useAudio = false; clock0 = performance.now() - au.currentTime * 1000; }); requestAnimationFrame(loop); }
  function pause() { playing = false; pp.textContent = '▶'; au.pause(); }
  document.getElementById('go').onclick = () => { document.getElementById('start').remove(); if (au.currentTime >= TOTAL - .1) au.currentTime = 0; play(); poke(); };
  pp.onclick = () => playing ? pause() : play();
  document.getElementById('bar').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); au.currentTime = clamp((e.clientX - r.left) / r.width) * TOTAL; if (!useAudio) clock0 = performance.now() - au.currentTime * 1000; if (!playing) render(au.currentTime); };
  document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  function poke() { ui.classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => ui.classList.add('hide'), 2200); }
  addEventListener('mousemove', poke);
  addEventListener('keydown', e => {
    if (document.getElementById('start')) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'KeyF') document.getElementById('fs').click();
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { au.currentTime = clamp(au.currentTime + (e.code === 'ArrowRight' ? 5 : -5), 0, TOTAL); if (!playing) render(au.currentTime); }
    poke();
  });
}
</script>
