<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大语言模型 · 一分钟看懂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;700&family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&family=STIX+Two+Text:ital,wght@0,400;1,400&display=block" rel="stylesheet">
<style>
  :root { --bg: #000; --fg: #eaf2ff; --gold: #ffd27a; --dim: rgba(255,255,255,.55); }
  :root:not([data-theme="light"]) { --bg: #000; }
  :root[data-theme="dark"] { --bg: #000; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: "Noto Serif SC", serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; background: #000; display: block; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(ellipse at center, #0a1226 0%, #000 70%); cursor: pointer; z-index: 5; text-align: center; padding: 16px; }
  #start h1 { font-weight: 900; font-size: clamp(40px, 9vw, 120px); margin: 0; letter-spacing: .12em;
    background: linear-gradient(120deg, #7a5520, #f3d88f 45%, #fff4d2 50%, #d9b25c 55%, #7a5520); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #start p { margin: 0; font-family: "Cinzel", serif; letter-spacing: .3em; color: #9fc4ff; font-size: clamp(12px, 2vw, 20px); }
  #start button { margin-top: 18px; font: 700 18px "Noto Serif SC", serif; color: #1a1206; background: var(--gold); border: 0; border-radius: 999px;
    padding: 14px 34px; cursor: pointer; letter-spacing: .15em; }
  #start small { color: var(--dim); font-size: 13px; letter-spacing: .1em; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px 16px; display: flex; gap: 14px; align-items: center;
    background: linear-gradient(transparent, rgba(0,0,0,.75)); transition: opacity .4s; z-index: 4; font: 13px "Cinzel", serif; color: #ddd; }
  #ui.hide { opacity: 0; }
  #ui button { background: none; border: 0; color: #fff; font-size: 18px; cursor: pointer; width: 32px; }
  #bar { flex: 1; height: 5px; background: rgba(255,255,255,.2); border-radius: 3px; cursor: pointer; position: relative; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); border-radius: 3px; width: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="start">
  <h1>大语言模型</h1>
  <p>HOW LARGE LANGUAGE MODELS WORK</p>
  <button id="go">▶ 播放</button>
  <small id="load">载入字体中…</small>
</div>
<div id="ui" class="hide"><button id="pp">❚❚</button><span id="tm">0:00</span><div id="bar"><div id="fill"></div></div><span id="dur">1:00</span><button id="fs">⛶</button></div>
<audio id="au" preload="auto"></audio>
{{SCRIPTS}}
</body>
</html>
